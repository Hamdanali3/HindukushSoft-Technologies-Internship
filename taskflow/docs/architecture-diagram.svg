<svg viewBox="0 0 1000 780" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
    </marker>
  </defs>

  <rect width="1000" height="780" fill="#ffffff"/>
  <text x="500" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1F4E79">TaskFlow — Layered Architecture</text>

  <!-- Clients row -->
  <rect x="90" y="65" width="330" height="60" rx="8" fill="#DCE6F1" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="255" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#1F4E79">Browser (Blade UI)</text>
  <text x="255" y="110" text-anchor="middle" font-size="12" fill="#333">session cookie auth</text>

  <rect x="580" y="65" width="330" height="60" rx="8" fill="#DCE6F1" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="745" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#1F4E79">API Client (JSON)</text>
  <text x="745" y="110" text-anchor="middle" font-size="12" fill="#333">Sanctum bearer token</text>

  <line x1="255" y1="125" x2="255" y2="160" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="745" y1="125" x2="745" y2="160" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Routes row -->
  <rect x="90" y="165" width="330" height="50" rx="8" fill="#FFF3CD" stroke="#B8860B" stroke-width="1.5"/>
  <text x="255" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#7a5c00">routes/web.php</text>

  <rect x="580" y="165" width="330" height="50" rx="8" fill="#FFF3CD" stroke="#B8860B" stroke-width="1.5"/>
  <text x="745" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#7a5c00">routes/api.php</text>

  <line x1="255" y1="215" x2="255" y2="250" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="745" y1="215" x2="745" y2="250" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Controllers row -->
  <rect x="90" y="255" width="330" height="60" rx="8" fill="#D9EAD3" stroke="#38761D" stroke-width="1.5"/>
  <text x="255" y="280" text-anchor="middle" font-size="14" font-weight="600" fill="#274e13">Web Controllers</text>
  <text x="255" y="298" text-anchor="middle" font-size="11" fill="#274e13">ProjectController, TaskController…</text>

  <rect x="580" y="255" width="330" height="60" rx="8" fill="#D9EAD3" stroke="#38761D" stroke-width="1.5"/>
  <text x="745" y="280" text-anchor="middle" font-size="14" font-weight="600" fill="#274e13">Api\* Controllers</text>
  <text x="745" y="298" text-anchor="middle" font-size="11" fill="#274e13">Api\ProjectController, Api\TaskController…</text>

  <line x1="255" y1="315" x2="255" y2="350" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="745" y1="315" x2="745" y2="350" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Converge into shared middle layer -->
  <line x1="255" y1="350" x2="500" y2="380" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="745" y1="350" x2="500" y2="380" stroke="#4a5568" stroke-width="1.5"/>

  <rect x="150" y="355" width="700" height="70" rx="8" fill="#F4CCCC" stroke="#990000" stroke-width="1.5"/>
  <text x="500" y="382" text-anchor="middle" font-size="15" font-weight="700" fill="#660000">Form Requests (validation) + Policies (authorization)</text>
  <text x="500" y="402" text-anchor="middle" font-size="11.5" fill="#660000">StoreTaskRequest · UpdateProjectRequest · ProjectPolicy · TaskPolicy · CommentPolicy</text>
  <text x="500" y="417" text-anchor="middle" font-size="10.5" font-style="italic" fill="#7a2a2a">— the SAME rule set applies whether the web or API layer calls it —</text>

  <line x1="500" y1="425" x2="500" y2="460" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Models -->
  <rect x="300" y="465" width="400" height="65" rx="8" fill="#CFE2F3" stroke="#0B5394" stroke-width="1.5"/>
  <text x="500" y="492" text-anchor="middle" font-size="15" font-weight="700" fill="#073763">Eloquent Models</text>
  <text x="500" y="512" text-anchor="middle" font-size="11.5" fill="#073763">User · Project · Task · Comment · project_user (pivot)</text>

  <line x1="500" y1="530" x2="500" y2="565" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Database -->
  <rect x="350" y="570" width="300" height="60" rx="8" fill="#E2D4F0" stroke="#4A1E7E" stroke-width="1.5"/>
  <text x="500" y="598" text-anchor="middle" font-size="15" font-weight="700" fill="#3d1466">Database</text>
  <text x="500" y="616" text-anchor="middle" font-size="11.5" fill="#3d1466">MySQL (prod) / SQLite (dev &amp; test)</text>

  <!-- API Resource shaping box, off to the side of API path -->
  <rect x="580" y="660" width="330" height="80" rx="8" fill="#FCE5CD" stroke="#B45F06" stroke-width="1.5"/>
  <text x="745" y="686" text-anchor="middle" font-size="14" font-weight="700" fill="#7f4c05">API Resources</text>
  <text x="745" y="705" text-anchor="middle" font-size="11" fill="#7f4c05">ProjectResource · TaskResource ·</text>
  <text x="745" y="720" text-anchor="middle" font-size="11" fill="#7f4c05">UserResource · CommentResource</text>
  <text x="745" y="735" text-anchor="middle" font-size="10" font-style="italic" fill="#a06a1c">shapes the JSON before it leaves the server</text>

  <path d="M700 630 Q745 645 745 660" fill="none" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <text x="500" y="765" text-anchor="middle" font-size="11" fill="#666">TaskFlow · Week 8 Capstone · Laravel 12 · dashed path = API-only response shaping step</text>
</svg>
